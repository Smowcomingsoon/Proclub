name: Billocchi game-night sync
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: billocchi-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check EA and publish after quiet period
        run: node scripts/sync-after-game-night.js
        env:
          EA_CLUB_ID: '294157'
          EA_PLATFORM: common-gen5
          QUIET_MINUTES: '30'
      - name: Commit only when files changed
        if: always()
        run: |
          git config user.name "billocchi-sync[bot]"
          git config user.email "billocchi-sync[bot]@users.noreply.github.com"
          git add data/overall.json data/members.json data/career.json data/sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync EA club stats"
            git push
          fi
