<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statistiche — BILLOCCHI CLUB</title>
<style>
:root{--bg:#0b0f0c;--card:#141a15;--line:#243026;--fg:#f2f5f0;--mut:#8b9a8e;--acc:#c6ff3d}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f1;--card:#fff;--line:#d9dfd4;--fg:#111a13;--mut:#5b6a5e;--acc:#3a7d00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;line-height:1.4}
header,main{max-width:1000px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}
a{color:var(--acc)}h1{margin:0;font-size:1.4rem}h2{margin:28px 0 10px;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card small{color:var(--mut);display:block}.card b{font-size:1.5rem}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:.9rem}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);cursor:pointer;font-weight:600;white-space:nowrap}.wrap{overflow-x:auto}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px}
.V{color:var(--acc)}.S{color:#ff6b6b}.P{color:var(--mut)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;margin-top:12px;text-align:center}
.h2h .l{text-align:right}.h2h .r{text-align:left}.h2h .m{color:var(--mut)}.win{color:var(--acc);font-weight:700}
</style></head><body>
<header><h1>BILLOCCHI CLUB · Statistiche</h1><a href="/">← Torna al sito</a></header>
<main>
<h2>Record del club</h2><div class="grid" id="records"></div>
<h2>Classifica Pro <small style="text-transform:none;letter-spacing:0;color:var(--mut)">(clicca le colonne per ordinare)</small></h2>
<div class="wrap"><table id="board"></table></div>
<h2>Testa a testa</h2>
<div><select id="pa"></select> <select id="pb"></select></div><div class="h2h" id="h2h"></div>
<h2>Archivio partite</h2>
<div><select id="month"></select></div><div class="wrap"><table id="archive"></table></div>
<h2>Bilancio contro gli avversari</h2><div class="wrap"><table id="opps"></table></div>
</main>
<script>
const $=id=>document.getElementById(id);
const num=v=>Number(v)||0;
const fmt=(t)=>new Date(t*1000).toLocaleString('it-IT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
Promise.all([fetch('/data.json').then(r=>r.json()),fetch('/archive.json').then(r=>r.json())]).then(([d,arch])=>{
  const club=d.club[0],ms=d.members.members.map(m=>({name:m.name,pos:m.favoritePosition||'',g:num(m.gamesPlayed),goals:num(m.goals),ast:num(m.assists),rating:num(m.ratingAve),pass:num(m.passSuccessRate),tkl:num(m.tacklesMade),motm:num(m.manOfTheMatch),red:num(m.redCards)}));
  $('records').innerHTML=[
    ['Partite',club.gamesPlayed],['Vittorie',club.wins],['Pareggi',club.ties],['Sconfitte',club.losses],
    ['Gol fatti',club.goals],['Gol subiti',club.goalsAgainst],['Serie utile',club.unbeatenstreak],['Skill rating',club.skillRating]
  ].map(([k,v])=>`<div class="card"><small>${k}</small><b>${v}</b></div>`).join('');
  const cols=[['name','Pro'],['g','Pres.'],['goals','Gol'],['ast','Ast'],['rating','Voto'],['pass','Pass %'],['tkl','Contrasti'],['motm','MVP']];
  let sort='goals',dir=-1;
  const draw=()=>{const rows=[...ms].sort((a,b)=>(a[sort]>b[sort]?1:-1)*dir);
    $('board').innerHTML='<thead><tr>'+cols.map(([k,l])=>`<th data-k="${k}">${l}${k===sort?(dir<0?' ▼':' ▲'):''}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(([k])=>`<td>${k==='rating'?r[k].toFixed(1):r[k]}</td>`).join('')+'</tr>').join('')+'</tbody>';
    $('board').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=k===sort?-dir:-1;sort=k;draw()})};
  draw();
  const opts=ms.map(m=>`<option>${m.name}</option>`).join('');$('pa').innerHTML=opts;$('pb').innerHTML=opts;$('pb').selectedIndex=Math.min(1,ms.length-1);
  const stats=[['Presenze','g'],['Gol','goals'],['Assist','ast'],['Voto medio','rating'],['Passaggi %','pass'],['Contrasti','tkl'],['MVP','motm']];
  const h2h=()=>{const a=ms.find(m=>m.name===$('pa').value),b=ms.find(m=>m.name===$('pb').value);
    $('h2h').innerHTML=`<b class="l">${a.name}</b><span></span><b class="r">${b.name}</b>`+stats.map(([l,k])=>`<span class="l ${a[k]>b[k]?'win':''}">${k==='rating'?a[k].toFixed(1):a[k]}</span><span class="m">${l}</span><span class="r ${b[k]>a[k]?'win':''}">${k==='rating'?b[k].toFixed(1):b[k]}</span>`).join('')};
  $('pa').onchange=$('pb').onchange=h2h;h2h();
  const months=[...new Set(arch.map(a=>a.month))];$('month').innerHTML=months.map(m=>`<option>${m}</option>`).join('');
  const res={1:'V',2:'S',0:'P'};
  const drawArch=()=>{const rows=arch.filter(a=>a.month===$('month').value);
    $('archive').innerHTML='<thead><tr><th>Data</th><th>Avversario</th><th>Risultato</th><th>Esito</th></tr></thead><tbody>'+rows.map(a=>{const e=a.goalsFor>a.goalsAgainst?'V':a.goalsFor<a.goalsAgainst?'S':'P';return `<tr><td>${fmt(a.timestamp)}</td><td>${a.opponent||'?'}</td><td>${a.goalsFor}–${a.goalsAgainst}</td><td class="${e}">${e}</td></tr>`}).join('')+'</tbody>'};
  $('month').onchange=drawArch;drawArch();
  const o={};arch.forEach(a=>{const k=a.opponent||'?';const r=o[k]??={n:0,V:0,P:0,S:0,gf:0,ga:0};const e=a.goalsFor>a.goalsAgainst?'V':a.goalsFor<a.goalsAgainst?'S':'P';r.n++;r[e]++;r.gf+=a.goalsFor;r.ga+=a.goalsAgainst});
  $('opps').innerHTML='<thead><tr><th>Avversario</th><th>Gare</th><th>V</th><th>P</th><th>S</th><th>Gol</th></tr></thead><tbody>'+Object.entries(o).sort((a,b)=>b[1].n-a[1].n).map(([k,r])=>`<tr><td>${k}</td><td>${r.n}</td><td>${r.V}</td><td>${r.P}</td><td>${r.S}</td><td>${r.gf}–${r.ga}</td></tr>`).join('')+'</tbody>';
}).catch(()=>{document.querySelector('main').innerHTML='<p>Dati non disponibili.</p>'});
</script></body></html>
